<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Admin Panel - ArtAble</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>🔧 Admin Panel</h1>
      <p>Add new products to ArtAble store</p>
    </header>

    <main id="login-section">
      <h2>Admin Login</h2>
      <form id="login-form">
        <input
          type="password"
          placeholder="Enter Admin Password"
          id="admin-password"
          required
        />
        <button type="submit">Login</button>
        <p id="login-msg"></p>
      </form>
    </main>

    <main id="admin-panel" style="display: none">
      <form id="admin-form">
        <input type="text" placeholder="Product Name" id="name" required />
        <input type="text" placeholder="Creator Name" id="creator" required />
        <input
          type="number"
          placeholder="Price"
          id="price"
          min="0.01"
          step="0.01"
          required
        />
        <input type="url" placeholder="Image URL" id="img" required />
        <select id="product-category" required>
          <option value="">Select Category</option>
          <option value="Art">Art</option>
          <option value="Clay">Clay</option>
          <option value="Music">Music</option>
          <option value="Books">Books</option>
        </select>
        <input
          type="text"
          placeholder="Tags (comma separated)"
          id="tags"
          required
        />
        <button type="submit">Add Product</button>
        <p id="admin-msg"></p>
      </form>

      <section>
        <h2>🖼️ Preview of Added Products</h2>
        <ul id="preview-list"></ul>
      </section>

      <div class="admin-actions">
        <button id="back-to-store">Return to Store</button>
      </div>
    </main>

    <footer>
      <p>&copy; 2025 ArtAble | Admin Mode</p>
    </footer>

    <script src="admin.js"></script>
  </body>
</html>
